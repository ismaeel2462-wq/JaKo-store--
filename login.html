
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101010">
    <meta name="description" content="تسجيل الدخول إلى حسابك في JAKO STORE.">
    <title>تسجيل الدخول | JAKO STORE</title>

    <link rel="stylesheet" href="store.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
    <script src="supabase-config.js"></script>
</head>

<body>

    <main class="auth-card">

        <a class="back-link" href="index.html">
            ⬅ العودة للمتجر
        </a>

        <h1 style="margin-top:20px">
            تسجيل الدخول
        </h1>

        <p class="lead">
            سجّل الدخول إلى حسابك لمتابعة طلبات الشحن واستخدام خدمات المتجر.
        </p>

        <form id="authForm">

            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>

                <input
                    class="form-control"
                    id="email"
                    type="email"
                    autocomplete="email"
                    placeholder="أدخل بريدك الإلكتروني"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور</label>

                <input
                    class="form-control"
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="أدخل كلمة المرور"
                    required
                >
            </div>

            <div
                id="message"
                class="message-box"
                role="status"
                aria-live="polite"
            ></div>

            <div class="auth-actions">

                <button
                    id="loginBtn"
                    class="submit-btn"
                    type="submit"
                >
                    تسجيل الدخول
                </button>

                <button
                    id="forgotBtn"
                    class="btn btn-dark"
                    type="button"
                >
                    نسيت كلمة المرور؟
                </button>

            </div>

        </form>

        <div class="auth-links">
            <a href="register.html">
                إنشاء حساب جديد
            </a>

            <a href="index.html">
                العودة إلى المتجر
            </a>
        </div>

        <div class="auth-links" style="margin-top:15px">
            <span style="color:#999">
                JAKO STORE © 2026
            </span>
        </div>

    </main>

    <script>
    (() => {
        "use strict";

        // =====================================
        // 1. INITIALIZATION
        // =====================================

        if (
            !window.JAKO ||
            !window.JAKO.client
        ) {
            console.error(
                "JAKO STORE: Supabase configuration is missing."
            );

            return;
        }

        const client = window.JAKO.client;

        const $ = (id) =>
            document.getElementById(id);

        const form = $("authForm");
        const loginBtn = $("loginBtn");
        const forgotBtn = $("forgotBtn");

        // =====================================
        // 2. MESSAGE HANDLER
        // =====================================

        function showMessage(text, type = "") {
            const element = $("message");

            element.textContent = text;
            element.className = "message-box " + type;
        }

        // =====================================
        // 3. SAFE RETURN URL
        // =====================================

        function getReturnURL() {
            const target =
                localStorage.getItem("returnAfterLogin");

            if (!target) {
                return "index.html";
            }

            try {
                const url = new URL(
                    target,
                    window.location.href
                );

                // لا نسمح بإعادة التوجيه إلى موقع خارجي.
                if (url.origin !== window.location.origin) {
                    return "index.html";
                }

                // منع الدوران داخل صفحة تسجيل الدخول.
                if (
                    url.pathname.endsWith("/login.html") ||
                    url.pathname.endsWith("/register.html")
                ) {
                    return "index.html";
                }

                return url.href;

            } catch (error) {
                return "index.html";
            }
        }

        // =====================================
        // 4. LOGIN
        // =====================================

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const email = $("email")
                .value
                .trim()
                .toLowerCase();

            const password = $("password").value;

            if (!email || !password) {
                showMessage(
                    "أدخل البريد الإلكتروني وكلمة المرور.",
                    "error"
                );

                return;
            }

            loginBtn.disabled = true;
            forgotBtn.disabled = true;

            loginBtn.textContent =
                "جارٍ تسجيل الدخول...";

            showMessage("");

            try {
                const { data, error } =
                    await client.auth.signInWithPassword({
                        email,
                        password
                    });

                if (error) {
                    throw error;
                }

                if (!data || !data.session) {
                    throw new Error(
                        "لم يتم إنشاء جلسة تسجيل الدخول."
                    );
                }

                showMessage(
                    "تم تسجيل الدخول بنجاح. جارٍ تحويلك...",
                    "success"
                );

                const destination = getReturnURL();

                localStorage.removeItem(
                    "returnAfterLogin"
                );

                window.location.replace(destination);

            } catch (error) {
                console.error(
                    "Login error:",
                    error
                );

                let message =
                    error.message ||
                    "تعذر تسجيل الدخول.";

                if (
                    /invalid login credentials/i.test(message)
                ) {
                    message =
                        "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
                }

                else if (
                    /email not confirmed/i.test(message)
                ) {
                    message =
                        "يرجى تأكيد البريد الإلكتروني أولاً.";
                }

                else if (
                    /too many requests/i.test(message)
                ) {
                    message =
                        "محاولات كثيرة. انتظر قليلاً ثم حاول مجدداً.";
                }

                showMessage(message, "error");

                loginBtn.disabled = false;
                forgotBtn.disabled = false;

                loginBtn.textContent =
                    "تسجيل الدخول";
            }
        });

        // =====================================
        // 5. PASSWORD RECOVERY
        // =====================================

        forgotBtn.addEventListener("click", async () => {

            const email = $("email")
                .value
                .trim()
                .toLowerCase();

            if (!email) {
                showMessage(
                    "أدخل بريدك الإلكتروني أولاً لإرسال رابط الاستعادة.",
                    "error"
                );

                $("email").focus();
                return;
            }

            forgotBtn.disabled = true;
            loginBtn.disabled = true;

            forgotBtn.textContent =
                "جارٍ إرسال الرابط...";

            try {
                const redirectTo = new URL(
                    "reset-password.html",
                    window.location.href
                ).href;

                const { error } =
                    await client.auth.resetPasswordForEmail(
                        email,
                        { redirectTo }
                    );

                if (error) {
                    throw error;
                }

                showMessage(
                    "تم طلب إرسال رابط إعادة تعيين كلمة المرور. تحقق من بريدك الوارد ومجلد الرسائل غير المرغوب فيها.",
                    "success"
                );

            } catch (error) {
                console.error(
                    "Password recovery error:",
                    error
                );

                showMessage(
                    error.message ||
                    "تعذر إرسال رابط استعادة كلمة المرور.",
                    "error"
                );

            } finally {
                forgotBtn.disabled = false;
                loginBtn.disabled = false;

                forgotBtn.textContent =
                    "نسيت كلمة المرور؟";
            }
        });

        // =====================================
        // 6. CHECK EXISTING SESSION
        // =====================================

        async function checkExistingSession() {
            try {
                const { data, error } =
                    await client.auth.getSession();

                if (error) {
                    throw error;
                }

                if (data.session) {
                    const destination = getReturnURL();

                    localStorage.removeItem(
                        "returnAfterLogin"
                    );

                    window.location.replace(destination);
                }

            } catch (error) {
                console.error(
                    "Session check error:",
                    error
                );
            }
        }

        checkExistingSession();

    })();
    </script>

</body>
</html>
