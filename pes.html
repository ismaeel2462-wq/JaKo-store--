
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121212">

    <title>شحن eFootball | JAKO STORE</title>
    <meta name="description" content="اشحن عملات eFootball واستمتع بتجربة كرة قدم مميزة عبر JAKO STORE.">

    <link rel="stylesheet" href="store.css">
</head>

<body data-product="pes">

    <header class="store-header">
        <a href="index.html" class="back-link">⬅️ العودة إلى المتجر</a>
        <div class="store-logo">JAKO <span>STORE</span></div>
    </header>

    <main class="product-page">

        <section class="product-hero">
            <div class="product-icon">⚽</div>

            <h1>eFootball</h1>

            <p>
                اشحن عملات eFootball واحصل على اللاعبين
                والعناصر التي تحتاجها لبناء فريقك.
            </p>
        </section>

        <section class="product-container">
            <div class="product-card">
                <main id="productRoot"></main>
            </div>
        </section>

    </main>

    <!-- نافذة الدفع عبر شام كاش -->
    <div id="qrModal" class="modal-overlay" style="display:none;">
        <div class="modal-content">

            <button type="button" id="modalClose" class="modal-close">
                &times;
            </button>

            <h2 id="qrTitle">الدفع عبر شام كاش</h2>

            <div class="qrcode-box">
                <img
                    src="qr-code.png"
                    alt="رمز QR للدفع عبر شام كاش"
                    class="qr-image"
                >
            </div>

            <p>رقم حساب شام كاش:</p>

            <div class="account-box">
                <strong id="qrAccount"></strong>
            </div>

            <p>رقم الملاحظة الخاص بطلبك:</p>

            <div class="note-box">
                <strong id="noteCode"></strong>
                <button type="button" id="modalCopy">
                    نسخ
                </button>
            </div>

            <p class="modal-instruction">
                يرجى تحويل المبلغ وإرسال تأكيد التحويل لإكمال طلبك.
            </p>

            <div class="modal-actions">
                <button type="button" id="modalConfirm">
                    تم التحويل وإرسال الطلب
                </button>

                <button type="button" id="modalCancel">
                    إلغاء
                </button>
            </div>

        </div>
    </div>

    <footer class="store-footer">
        <p>© 2026 JAKO STORE - جميع الحقوق محفوظة</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
    <script src="supabase-config.js"></script>
    <script src="catalog.js"></script>
    <script src="product-engine.js"></script>

</body>
</html>
