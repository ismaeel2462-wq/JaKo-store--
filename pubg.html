
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121212">
    <meta name="description" content="اشحن شدات PUBG Mobile عبر JAKO STORE بسهولة.">
    <title>شحن PUBG Mobile | JAKO STORE</title>

    <link rel="stylesheet" href="store.css">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #121212;
            color: #fff;
            font-family: Arial, Tahoma, sans-serif;
        }

        .page-header {
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 16px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #292929;
            background: rgba(23, 23, 23, .95);
            backdrop-filter: blur(12px);
        }

        .brand {
            color: #ff9800;
            font-size: 22px;
            font-weight: 900;
            text-decoration: none;
        }

        .back-link {
            color: #ddd;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #ff9800;
        }

        #productRoot {
            width: min(100% - 24px, 700px);
            margin: 25px auto 50px;
        }

        .loading-message {
            text-align: center;
            color: #aaa;
            padding: 55px 10px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 18px;
        }

        .loading-spinner {
            width: 36px;
            height: 36px;
            margin: 0 auto 15px;
            border: 3px solid #444;
            border-top-color: #ff9800;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .page-footer {
            padding: 22px 15px;
            text-align: center;
            color: #777;
            font-size: 12px;
            border-top: 1px solid #292929;
        }

        @media (max-width: 500px) {
            .page-header {
                padding: 14px 16px;
            }

            .brand {
                font-size: 19px;
            }

            #productRoot {
                width: calc(100% - 16px);
                margin-top: 15px;
            }
        }
    </style>
</head>

<body data-product="pubg">

    <header class="page-header">
        <a href="index.html" class="brand">JAKO STORE</a>
        <a href="index.html" class="back-link">⬅ العودة للمتجر</a>
    </header>

    <main id="productRoot">

        <div class="loading-message">
            <div class="loading-spinner"></div>
            جارٍ تحميل باقات PUBG Mobile...
        </div>

    </main>

    <footer class="page-footer">
        جميع الحقوق محفوظة © JAKO STORE
    </footer>

    <!-- نافذة شام كاش -->
    <div
        class="modal"
        id="qrModal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="qrTitle"
    >
        <div class="modal-content">

            <button
                class="modal-close"
                id="modalClose"
                type="button"
                aria-label="إغلاق"
            >×</button>

            <h2 id="qrTitle">تحويل عبر شام كاش</h2>

            <p>
                حوّل المبلغ إلى الحساب التالي،
                وضع رقم الملاحظة في خانة الملاحظات داخل تطبيق شام كاش.
            </p>

            <div class="qr-box">
                <img
                    src="qr-code.png"
                    alt="رمز QR لشام كاش"
                    onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/ismaeel2462-wq/JaKo-store--/main/qr-code.png'"
                >
            </div>

            <p>
                رقم الحساب:
                <strong
                    id="qrAccount"
                    style="color:var(--orange)"
                >0976567876</strong>
            </p>

            <div class="note-box">
                <span class="note-code" id="noteCode">--------</span>

                <button
                    class="copy-btn"
                    id="modalCopy"
                    type="button"
                >
                    نسخ رقم الملاحظة
                </button>
            </div>

            <p>
                بعد إتمام التحويل، اضغط على تأكيد
                لإرسال تفاصيل الطلب عبر واتساب.
            </p>

            <div class="modal-actions">

                <button
                    class="btn btn-green"
                    id="modalConfirm"
                    type="button"
                >
                    ✅ تم التحويل — إرسال الطلب
                </button>

                <button
                    class="secondary-btn"
                    id="modalCancel"
                    type="button"
                >
                    إلغاء
                </button>

            </div>

        </div>
    </div>

    <!-- المكتبات والإعدادات والمحرك بالترتيب الصحيح -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
    <script src="supabase-config.js"></script>
    <script src="catalog.js"></script>
    <script src="product-engine.js"></script>

</body>
</html>
