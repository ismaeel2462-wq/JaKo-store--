
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121212">
    <title>إنشاء حساب | JAKO STORE</title>
    <link rel="stylesheet" href="store.css">

    <style>
        .auth-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 25px;
            background:
                radial-gradient(circle at 20% 20%, #ff98001c, transparent 35%),
                radial-gradient(circle at 80% 80%, #ff980015, transparent 35%),
                #121212;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            padding: 35px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 20px;
            box-shadow: 0 20px 70px #0008;
            animation: authAppear .5s ease;
        }

        @keyframes authAppear {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
            border-radius: 22px;
            background: linear-gradient(135deg, #ffb74d, #ff6d00);
            color: #171717;
            font-size: 27px;
            font-weight: 900;
            box-shadow: 0 8px 30px #ff980044;
        }

        .auth-card h1 {
            text-align: center;
            color: #fff;
            margin: 0 0 8px;
        }

        .auth-subtitle {
            color: #aaa;
            text-align: center;
            margin: 0 0 28px;
            font-size: 14px;
            line-height: 1.7;
        }

        .auth-field {
            margin-bottom: 18px;
        }

        .auth-field label {
            display: block;
            color: #eee;
            margin-bottom: 9px;
            font-size: 14px;
        }

        .auth-field input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #444;
            outline: none;
            background: #151515;
            color: white;
            font-size: 15px;
            transition: border-color .2s;
        }

        .auth-field input:focus {
            border-color: #ff9800;
        }

        .auth-password {
            position: relative;
        }

        .auth-password input {
            padding-left: 65px;
        }

        .password-toggle {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: #ffb74d;
            cursor: pointer;
            padding: 7px;
        }

        .auth-submit {
            width: 100%;
            padding: 15px;
            border: 0;
            border-radius: 11px;
            background: linear-gradient(135deg, #ffb74d, #ff9800);
            color: #171717;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: .2s;
        }

        .auth-submit:hover {
            filter: brightness(1.08);
            transform: translateY(-2px);
        }

        .auth-submit:disabled {
            opacity: .6;
            cursor: wait;
            transform: none;
        }

        .auth-message {
            display: none;
            margin-top: 17px;
            padding: 12px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.8;
        }

        .auth-message.error {
            display: block;
            color: #ff8a80;
            background: #b71c1c22;
            border: 1px solid #b71c1c66;
        }

        .auth-message.success {
            display: block;
            color: #81c784;
            background: #1b5e2022;
            border: 1px solid #2e7d3266;
        }

        .auth-footer {
            text-align: center;
            color: #aaa;
            margin-top: 25px;
            font-size: 14px;
        }

        .auth-footer a {
            color: #ffb74d;
            text-decoration: none;
            font-weight: bold;
        }

        .auth-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #888;
            text-decoration: none;
            font-size: 13px;
        }

        .auth-note {
            color: #888;
            font-size: 12px;
            line-height: 1.7;
            margin-top: 15px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .auth-card { padding: 25px 20px; }
        }
    </style>
</head>

<body>

<div class="auth-page">

    <main class="auth-card">

        <div class="auth-logo">JS</div>

        <h1>إنشاء حساب جديد</h1>

        <p class="auth-subtitle">
            أنشئ حسابك وابدأ التسوق من JAKO STORE
        </p>

        <form id="registerForm">

            <div class="auth-field">
                <label for="fullName">الاسم</label>
                <input
                    type="text"
                    id="fullName"
                    placeholder="أدخل اسمك"
                    autocomplete="name"
                    minlength="2"
                    maxlength="60"
                    required
                >
            </div>

            <div class="auth-field">
                <label for="email">البريد الإلكتروني</label>
                <input
                    type="email"
                    id="email"
                    placeholder="example@email.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="auth-field">
                <label for="password">كلمة المرور</label>

                <div class="auth-password">
                    <input
                        type="password"
                        id="password"
                        placeholder="6 أحرف على الأقل"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword"
                    >
                        إظهار
                    </button>
                </div>
            </div>

            <div class="auth-field">
                <label for="confirmPassword">تأكيد كلمة المرور</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="أعد كتابة كلمة المرور"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >
            </div>

            <button
                type="submit"
                class="auth-submit"
                id="registerButton"
            >
                إنشاء الحساب
            </button>

            <div
                id="authMessage"
                class="auth-message"
                role="status"
                aria-live="polite"
            ></div>

        </form>

        <p class="auth-note">
            قد تحتاج إلى تأكيد بريدك الإلكتروني قبل تسجيل الدخول،
            بحسب إعدادات المتجر.
        </p>

        <div class="auth-footer">
            لديك حساب بالفعل؟
            <a href="login.html">تسجيل الدخول</a>
        </div>

        <a href="index.html" class="auth-home">
            ⬅ العودة إلى المتجر
        </a>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
(function () {
    "use strict";

    const form = document.getElementById("registerForm");
    const fullNameInput = document.getElementById("fullName");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const button = document.getElementById("registerButton");
    const message = document.getElementById("authMessage");
    const toggle = document.getElementById("togglePassword");

    function showMessage(text, type) {
        message.textContent = text;
        message.className = "auth-message " + type;
    }

    toggle.addEventListener("click", function () {
        const visible = passwordInput.type === "text";

        passwordInput.type = visible ? "password" : "text";
        confirmPasswordInput.type = visible ? "password" : "text";
        toggle.textContent = visible ? "إظهار" : "إخفاء";
    });

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const fullName = fullNameInput.value.trim();
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (fullName.length < 2) {
            showMessage("يرجى إدخال اسم صحيح.", "error");
            return;
        }

        if (password.length < 6) {
            showMessage("يجب أن تتكون كلمة المرور من 6 أحرف على الأقل.", "error");
            return;
        }

        if (password !== confirmPassword) {
            showMessage("كلمتا المرور غير متطابقتين.", "error");
            return;
        }

        if (!window.JAKO_STORE || !window.JAKO_STORE.client) {
            showMessage("تعذر الاتصال بالخادم. حاول لاحقاً.", "error");
            return;
        }

        button.disabled = true;
        button.textContent = "جارٍ إنشاء الحساب...";

        try {
            const { data, error } =
                await window.JAKO_STORE.client.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: fullName
                        }
                    }
                });

            if (error) {
                throw error;
            }

            if (data.session) {
                showMessage(
                    "تم إنشاء حسابك بنجاح! جارٍ تحويلك إلى المتجر...",
                    "success"
                );

                setTimeout(function () {
                    window.location.replace("index.html");
                }, 1200);

            } else {
                showMessage(
                    "تم إنشاء الحساب. تحقق من بريدك الإلكتروني واضغط رابط التأكيد، ثم سجل الدخول.",
                    "success"
                );

                form.reset();
            }

        } catch (error) {
            console.error("Registration error:", error);

            let errorText = "تعذر إنشاء الحساب. حاول مرة أخرى.";

            const errorMessage = (error.message || "").toLowerCase();

            if (
                errorMessage.includes("already registered") ||
                errorMessage.includes("user already registered")
            ) {
                errorText = "هذا البريد مسجل بالفعل. يمكنك تسجيل الدخول.";
            } else if (errorMessage.includes("password")) {
                errorText = "كلمة المرور غير مقبولة. استخدم 6 أحرف على الأقل.";
            } else if (errorMessage.includes("invalid email")) {
                errorText = "يرجى إدخال بريد إلكتروني صحيح.";
            } else if (errorMessage.includes("rate limit")) {
                errorText = "تم إرسال طلبات كثيرة. انتظر قليلاً ثم حاول مجدداً.";
            }

            showMessage(errorText, "error");

        } finally {
            button.disabled = false;
            button.textContent = "إنشاء الحساب";
        }
    });

})();
</script>

</body>
</html>
