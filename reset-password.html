
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121212">
    <title>استعادة كلمة المرور | JAKO STORE</title>
    <link rel="stylesheet" href="store.css">

    <style>
        .auth-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 25px;
            background:
                radial-gradient(circle at 20% 20%, #ff98001c, transparent 35%),
                radial-gradient(circle at 80% 80%, #ff980015, transparent 35%),
                #121212;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            padding: 35px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 20px;
            box-shadow: 0 20px 70px #0008;
        }

        .auth-logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
            border-radius: 22px;
            background: linear-gradient(135deg, #ffb74d, #ff6d00);
            color: #171717;
            font-size: 27px;
            font-weight: 900;
        }

        h1 {
            text-align: center;
            color: #fff;
            margin: 0 0 10px;
        }

        .auth-subtitle {
            color: #aaa;
            text-align: center;
            margin: 0 0 28px;
            font-size: 14px;
            line-height: 1.8;
        }

        .auth-field {
            margin-bottom: 18px;
        }

        .auth-field label {
            display: block;
            color: #eee;
            margin-bottom: 9px;
            font-size: 14px;
        }

        .auth-field input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #444;
            outline: none;
            background: #151515;
            color: white;
            font-size: 15px;
        }

        .auth-field input:focus {
            border-color: #ff9800;
        }

        .auth-submit {
            width: 100%;
            padding: 15px;
            border: 0;
            border-radius: 11px;
            background: linear-gradient(135deg, #ffb74d, #ff9800);
            color: #171717;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }

        .auth-submit:disabled {
            opacity: .6;
            cursor: wait;
        }

        .auth-message {
            display: none;
            margin-top: 17px;
            padding: 12px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.8;
        }

        .auth-message.error {
            display: block;
            color: #ff8a80;
            background: #b71c1c22;
            border: 1px solid #b71c1c66;
        }

        .auth-message.success {
            display: block;
            color: #81c784;
            background: #1b5e2022;
            border: 1px solid #2e7d3266;
        }

        .auth-footer {
            text-align: center;
            color: #aaa;
            margin-top: 25px;
            font-size: 14px;
        }

        .auth-footer a,
        .auth-home {
            color: #ffb74d;
            text-decoration: none;
        }

        .auth-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .auth-card { padding: 25px 20px; }
        }
    </style>
</head>

<body>

<div class="auth-page">

    <main class="auth-card">

        <div class="auth-logo">JS</div>

        <h1>نسيت كلمة المرور؟</h1>

        <p class="auth-subtitle">
            أدخل بريدك الإلكتروني وسنرسل إليك رابطاً لإعادة تعيين كلمة المرور.
        </p>

        <form id="resetForm">

            <div class="auth-field">
                <label for="email">البريد الإلكتروني</label>

                <input
                    type="email"
                    id="email"
                    placeholder="example@email.com"
                    autocomplete="email"
                    required
                >
            </div>

            <button
                type="submit"
                class="auth-submit"
                id="resetButton"
            >
                إرسال رابط الاستعادة
            </button>

            <div
                id="authMessage"
                class="auth-message"
                role="status"
                aria-live="polite"
            ></div>

        </form>

        <div class="auth-footer">
            تذكرت كلمة المرور؟
            <a href="login.html">تسجيل الدخول</a>
        </div>

        <a href="index.html" class="auth-home">
            ⬅ العودة إلى المتجر
        </a>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
(function () {
    "use strict";

    const form = document.getElementById("resetForm");
    const emailInput = document.getElementById("email");
    const button = document.getElementById("resetButton");
    const message = document.getElementById("authMessage");

    function showMessage(text, type) {
        message.textContent = text;
        message.className = "auth-message " + type;
    }

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const email = emailInput.value.trim();

        if (!email) {
            showMessage("يرجى إدخال بريدك الإلكتروني.", "error");
            return;
        }

        if (!window.JAKO_STORE || !window.JAKO_STORE.client) {
            showMessage("تعذر الاتصال بالخادم. حاول لاحقاً.", "error");
            return;
        }

        button.disabled = true;
        button.textContent = "جارٍ الإرسال...";

        try {
            const redirectUrl = new URL(
                "update-password.html",
                window.location.href
            ).href;

            const { error } =
                await window.JAKO_STORE.client.auth.resetPasswordForEmail(
                    email,
                    {
                        redirectTo: redirectUrl
                    }
                );

            if (error) {
                throw error;
            }

            showMessage(
                "إذا كان البريد مسجلاً، فستصلك رسالة تحتوي على رابط استعادة كلمة المرور. تحقق أيضاً من مجلد الرسائل غير المرغوب فيها.",
                "success"
            );

        } catch (error) {
            console.error("Password reset error:", error);

            showMessage(
                "تعذر إرسال رابط الاستعادة. تحقق من البريد وحاول مجدداً.",
                "error"
            );

        } finally {
            button.disabled = false;
            button.textContent = "إرسال رابط الاستعادة";
        }
    });

})();
</script>

</body>
</html>
