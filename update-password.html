
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121212">
    <title>تعيين كلمة مرور جديدة | JAKO STORE</title>
    <link rel="stylesheet" href="store.css">

    <style>
        .auth-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 25px;
            background:
                radial-gradient(circle at 20% 20%, #ff98001c, transparent 35%),
                radial-gradient(circle at 80% 80%, #ff980015, transparent 35%),
                #121212;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            padding: 35px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 20px;
            box-shadow: 0 20px 70px #0008;
        }

        .auth-logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
            border-radius: 22px;
            background: linear-gradient(135deg, #ffb74d, #ff6d00);
            color: #171717;
            font-size: 27px;
            font-weight: 900;
        }

        h1 {
            text-align: center;
            color: #fff;
            margin: 0 0 10px;
        }

        .auth-subtitle {
            color: #aaa;
            text-align: center;
            margin: 0 0 28px;
            font-size: 14px;
            line-height: 1.8;
        }

        .auth-field {
            margin-bottom: 18px;
        }

        .auth-field label {
            display: block;
            color: #eee;
            margin-bottom: 9px;
            font-size: 14px;
        }

        .auth-field input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #444;
            outline: none;
            background: #151515;
            color: white;
            font-size: 15px;
        }

        .auth-field input:focus {
            border-color: #ff9800;
        }

        .auth-submit {
            width: 100%;
            padding: 15px;
            border: 0;
            border-radius: 11px;
            background: linear-gradient(135deg, #ffb74d, #ff9800);
            color: #171717;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }

        .auth-submit:disabled {
            opacity: .6;
            cursor: wait;
        }

        .auth-message {
            display: none;
            margin-top: 17px;
            padding: 12px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.8;
        }

        .auth-message.error {
            display: block;
            color: #ff8a80;
            background: #b71c1c22;
            border: 1px solid #b71c1c66;
        }

        .auth-message.success {
            display: block;
            color: #81c784;
            background: #1b5e2022;
            border: 1px solid #2e7d3266;
        }

        .auth-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
        }

        .auth-footer a,
        .auth-home {
            color: #ffb74d;
            text-decoration: none;
        }

        .auth-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .auth-card { padding: 25px 20px; }
        }
    </style>
</head>

<body>

<div class="auth-page">

    <main class="auth-card">

        <div class="auth-logo">JS</div>

        <h1>كلمة مرور جديدة</h1>

        <p class="auth-subtitle">
            أدخل كلمة المرور الجديدة لحسابك في JAKO STORE.
        </p>

        <form id="updateForm">

            <div class="auth-field">
                <label for="password">كلمة المرور الجديدة</label>
                <input
                    type="password"
                    id="password"
                    placeholder="6 أحرف على الأقل"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="auth-field">
                <label for="confirmPassword">تأكيد كلمة المرور</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="أعد كتابة كلمة المرور"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button
                type="submit"
                class="auth-submit"
                id="updateButton"
            >
                حفظ كلمة المرور الجديدة
            </button>

            <div
                id="authMessage"
                class="auth-message"
                role="status"
                aria-live="polite"
            ></div>

        </form>

        <div class="auth-footer">
            <a href="login.html">العودة إلى تسجيل الدخول</a>
        </div>

        <a href="index.html" class="auth-home">
            ⬅ العودة إلى المتجر
        </a>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
(function () {
    "use strict";

    const form = document.getElementById("updateForm");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirmPassword");
    const button = document.getElementById("updateButton");
    const message = document.getElementById("authMessage");

    let recoveryReady = false;

    function showMessage(text, type) {
        message.textContent = text;
        message.className = "auth-message " + type;
    }

    async function initializeRecovery() {
        const client = window.JAKO_STORE?.client;

        if (!client) {
            showMessage("تعذر الاتصال بالخادم. حاول تحديث الصفحة.", "error");
            button.disabled = true;
            return;
        }

        try {
            const url = new URL(window.location.href);
            const code = url.searchParams.get("code");

            if (code) {
                const { error } = await client.auth.exchangeCodeForSession(code);

                if (error) throw error;

                url.searchParams.delete("code");
                window.history.replaceState({}, document.title, url.pathname + url.search + url.hash);
            }

            const { data, error } = await client.auth.getSession();

            if (error) throw error;

            if (!data.session) {
                throw new Error("رابط الاستعادة غير صالح أو انتهت صلاحيته.");
            }

            recoveryReady = true;
            button.disabled = false;

        } catch (error) {
            console.error("Recovery initialization:", error);

            showMessage(
                "رابط الاستعادة غير صالح أو منتهي الصلاحية. اطلب رابطاً جديداً من صفحة استعادة كلمة المرور.",
                "error"
            );

            button.disabled = true;
        }
    }

    button.disabled = true;
    initializeRecovery();

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        if (!recoveryReady) {
            showMessage("يجب فتح رابط الاستعادة الصحيح من بريدك الإلكتروني أولاً.", "error");
            return;
        }

        const password = passwordInput.value;
        const confirmPassword = confirmInput.value;

        if (password.length < 6) {
            showMessage("يجب أن تتكون كلمة المرور من 6 أحرف على الأقل.", "error");
            return;
        }

        if (password !== confirmPassword) {
            showMessage("كلمتا المرور غير متطابقتين.", "error");
            return;
        }

        button.disabled = true;
        button.textContent = "جارٍ حفظ كلمة المرور...";

        try {
            const { error } =
                await window.JAKO_STORE.client.auth.updateUser({
                    password: password
                });

            if (error) throw error;

            showMessage(
                "تم تغيير كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول.",
                "success"
            );

            form.reset();

            setTimeout(function () {
                window.location.replace("login.html");
            }, 1800);

        } catch (error) {
            console.error("Update password error:", error);

            showMessage(
                "تعذر تغيير كلمة المرور. قد يكون رابط الاستعادة منتهي الصلاحية، اطلب رابطاً جديداً.",
                "error"
            );

        } finally {
            button.disabled = false;
            button.textContent = "حفظ كلمة المرور الجديدة";
        }
    });

})();
</script>

</body>
</html>
